<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">SM120 packed GEMV two-dimensional shared-memory coordinate map</title>
  <desc id="desc">Global K-major packed weights are copied into a two-dimensional shared stage. A two-dimensional consumer encoding maps each lane to eight contiguous K values without introducing a five-dimensional shared descriptor.</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .global { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; }
    .shared { fill: #fef3c7; stroke: #b45309; stroke-width: 1.4; }
    .consumer { fill: #dcfce7; stroke: #15803d; stroke-width: 1.4; }
    .accent { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 1.4; }
    .title { fill: #172033; font: 700 27px system-ui, sans-serif; }
    .subtitle { fill: #526176; font: 400 14px system-ui, sans-serif; }
    .head { fill: #172033; font: 700 17px system-ui, sans-serif; }
    .body { fill: #334155; font: 400 13px system-ui, sans-serif; }
    .small { fill: #64748b; font: 400 11px system-ui, sans-serif; }
    .mono { fill: #172033; font: 600 13px ui-monospace, SFMono-Regular, monospace; }
    .cell { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1; }
    .atom0 { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1; }
    .atom1 { fill: #ffedd5; stroke: #fb923c; stroke-width: 1; }
    .lane0 { fill: #bfdbfe; stroke: #2563eb; stroke-width: 1; }
    .lane1 { fill: #bbf7d0; stroke: #16a34a; stroke-width: 1; }
    .arrow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 6 5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="940"/>
  <text class="title" x="48" y="48">Packed BF16 GEMV: keep shared storage 2D, vectorize the access</text>
  <text class="subtitle" x="48" y="75">C2 template contract: N_tile=64, K_tile=128, NVector=8, KPack=2, KVector=8</text>

  <rect class="panel" x="40" y="102" width="470" height="370" rx="6"/>
  <text class="head" x="64" y="134">1. Global packed atom [C2]</text>
  <text class="mono" x="64" y="161">[K/16, N/8]&lt;N8, K2, K8&gt;</text>
  <text class="body" x="64" y="186">One outer coordinate contains an 8 x 16 BF16 atom.</text>

  <text class="small" x="115" y="220">K0..K7</text>
  <text class="small" x="315" y="220">K8..K15</text>
  <text class="small" x="69" y="255">N0</text>
  <text class="small" x="69" y="287">N1</text>
  <text class="small" x="69" y="319">N2</text>
  <text class="small" x="69" y="351">...</text>
  <text class="small" x="69" y="415">N7</text>

  <rect class="atom0" x="95" y="233" width="174" height="30"/>
  <rect class="atom1" x="271" y="233" width="174" height="30"/>
  <rect class="atom0" x="95" y="265" width="174" height="30"/>
  <rect class="atom1" x="271" y="265" width="174" height="30"/>
  <rect class="atom0" x="95" y="297" width="174" height="30"/>
  <rect class="atom1" x="271" y="297" width="174" height="30"/>
  <rect class="cell" x="95" y="329" width="350" height="54"/>
  <rect class="atom0" x="95" y="385" width="174" height="30"/>
  <rect class="atom1" x="271" y="385" width="174" height="30"/>

  <text class="small" x="182" y="253" text-anchor="middle">8 contiguous bf16</text>
  <text class="small" x="358" y="253" text-anchor="middle">8 contiguous bf16</text>
  <text class="small" x="270" y="362" text-anchor="middle">N3 .. N6</text>
  <text class="mono" x="64" y="448">linear inner = n_lane * 16 + k_inner</text>

  <path class="arrow" d="M 512 287 L 560 287"/>

  <rect class="panel" x="562" y="102" width="510" height="370" rx="6"/>
  <text class="head" x="586" y="134">2. Two-dimensional shared stage [C1, C2]</text>
  <text class="mono" x="586" y="161">stage[64, 128] bf16</text>
  <text class="body" x="586" y="186">Each packed 8 x 16 atom becomes one 128-element row.</text>

  <rect class="shared" x="586" y="216" width="452" height="52"/>
  <rect class="shared" x="586" y="276" width="452" height="52"/>
  <rect class="shared" x="586" y="336" width="452" height="52"/>
  <rect class="shared" x="586" y="396" width="452" height="42"/>
  <line class="dash" x1="642" y1="216" x2="642" y2="438"/>
  <line class="dash" x1="982" y1="216" x2="982" y2="438"/>

  <text class="small" x="614" y="246" text-anchor="middle">row</text>
  <text class="mono" x="656" y="247">N0 K0..15 | N1 K0..15 | ... | N7 K0..15</text>
  <text class="small" x="614" y="306" text-anchor="middle">row</text>
  <text class="mono" x="656" y="307">next (k_outer, n_outer) atom</text>
  <text class="small" x="614" y="366" text-anchor="middle">...</text>
  <text class="mono" x="656" y="367">64 rows total for a 64 x 128 tile</text>
  <text class="small" x="614" y="422" text-anchor="middle">row</text>
  <text class="mono" x="656" y="423">128 contiguous bf16 columns</text>

  <text class="mono" x="586" y="458">row = (k/16) * 8 + n/8</text>
  <text class="mono" x="820" y="458">col = (n%8) * 16 + k%16</text>

  <path class="arrow" d="M 1074 287 L 1122 287"/>

  <rect class="panel" x="1124" y="102" width="436" height="370" rx="6"/>
  <text class="head" x="1148" y="134">3. Logical consumer tile [C2]</text>
  <text class="mono" x="1148" y="161">tensor&lt;64 x 32 x bf16&gt;</text>
  <text class="body" x="1148" y="186">Encoding distributes N across warps and K across lanes.</text>

  <rect class="consumer" x="1148" y="216" width="388" height="62"/>
  <text class="mono" x="1168" y="241">sizePerThread  = [1, 8]</text>
  <text class="mono" x="1168" y="263">threadsPerWarp = [8, 4]</text>

  <text class="small" x="1148" y="307">One four-lane group, one N value:</text>
  <rect class="lane0" x="1148" y="322" width="91" height="56"/>
  <rect class="lane1" x="1247" y="322" width="91" height="56"/>
  <rect class="lane0" x="1346" y="322" width="91" height="56"/>
  <rect class="lane1" x="1445" y="322" width="91" height="56"/>
  <text class="mono" x="1193" y="344" text-anchor="middle">lane 0</text>
  <text class="small" x="1193" y="364" text-anchor="middle">K0..7</text>
  <text class="mono" x="1292" y="344" text-anchor="middle">lane 1</text>
  <text class="small" x="1292" y="364" text-anchor="middle">K8..15</text>
  <text class="mono" x="1391" y="344" text-anchor="middle">lane 2</text>
  <text class="small" x="1391" y="364" text-anchor="middle">K16..23</text>
  <text class="mono" x="1490" y="344" text-anchor="middle">lane 3</text>
  <text class="small" x="1490" y="364" text-anchor="middle">K24..31</text>

  <text class="mono" x="1148" y="410">8 bf16/lane = 16 bytes/lane</text>
  <text class="mono" x="1148" y="438">PTX: ld.shared.v4.b32 [B1]</text>

  <rect class="panel" x="40" y="504" width="1520" height="378" rx="6"/>
  <text class="head" x="64" y="538">The three concepts stay separate</text>

  <rect class="global" x="64" y="566" width="444" height="232" rx="5"/>
  <text class="head" x="88" y="599">Physical storage rank</text>
  <text class="mono" x="88" y="629">per-stage descriptor = [rows, 128]</text>
  <text class="body" x="88" y="658">C2 emits one 128-element physical axis in the shared</text>
  <text class="body" x="88" y="681">address map. A stage ring adds only a prefix dimension.</text>
  <text class="mono" x="88" y="720">allocation = [S, rows, 128]</text>
  <text class="small" x="88" y="756">No synthetic 5D shared-memory shape.</text>

  <rect class="consumer" x="578" y="566" width="444" height="232" rx="5"/>
  <text class="head" x="602" y="599">Logical tensor distribution</text>
  <text class="mono" x="602" y="629">consumer = [N_tile, K_group]</text>
  <text class="body" x="602" y="658">A 2D BlockEncoding assigns contiguous K values to each</text>
  <text class="body" x="602" y="681">lane and assigns independent N values across lanes/warps.</text>
  <text class="mono" x="602" y="720">4 lanes x K8 = one K32 group</text>
  <text class="small" x="602" y="756">This controls work placement, not storage rank.</text>

  <rect class="accent" x="1092" y="566" width="444" height="232" rx="5"/>
  <text class="head" x="1116" y="599">Load vectorization proof</text>
  <text class="mono" x="1116" y="629">max_contiguous(..., [1, 8])</text>
  <text class="mono" x="1116" y="655">multiple_of(..., [1, 16])</text>
  <text class="body" x="1116" y="686">C2 emits the hints; B1 records the resulting vector PTX.</text>
  <text class="mono" x="1116" y="720">tt.load -&gt; ld.shared.v4.b32</text>
  <text class="small" x="1116" y="756">No requirement to manufacture ttg.local_load.</text>

  <path class="arrow" d="M 510 682 L 566 682"/>
  <path class="arrow" d="M 1024 682 L 1080 682"/>
  <text class="small" x="48" y="918">Sources: C1 selector, C2 template, and B1 benchmark artifact as defined in sm120-pipeline-sizing.md.</text>
</svg>
